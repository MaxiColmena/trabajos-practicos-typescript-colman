name: Pruebas TLP4 U4

on:
  push:
    paths:
      - 'tlp4-u4-intro-calidad-y-pruebas-de-software/demo_practica/**'
      - '.github/workflows/pruebas-tlp4-u4.yml'
  pull_request:
    paths:
      - 'tlp4-u4-intro-calidad-y-pruebas-de-software/demo_practica/**'
      - '.github/workflows/pruebas-tlp4-u4.yml'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tlp4-u4-intro-calidad-y-pruebas-de-software/demo_practica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tlp4-u4-intro-calidad-y-pruebas-de-software/demo_practica/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
